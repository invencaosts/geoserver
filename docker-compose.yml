services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_dev_pw
      POSTGRES_DB: geo_grilagem
    ports:
      - "5435:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo_grilagem"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - ./data/redis:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geo_admin
      MINIO_ROOT_PASSWORD: geo_dev_pw_123
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - ./data/minio:/data

  minio-init:
    image: minio/minio:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: geo_admin
      MINIO_ROOT_PASSWORD: geo_dev_pw_123
      MINIO_APP_USER: geo_app
      MINIO_APP_PASSWORD: geo_app_dev_pw_123
    volumes:
      - ./infra/minio:/policies:ro
    entrypoint: >-
      /bin/sh -c '
      set -eu;
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      mc mb --ignore-existing local/geo-datasets local/avatars local/attachments local/case-evidence local/timeline-leis;
      mc admin user add local "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}" || mc admin user info local "$${MINIO_APP_USER}";
      mc admin policy create local geo-app /policies/app-policy.json;
      mc admin policy attach local geo-app --user "$${MINIO_APP_USER}";
      mc anonymous set download local/avatars;
      mc anonymous set download local/timeline-leis;
      mc anonymous set none local/attachments;
      mc anonymous set-json /policies/attachments-public-policy.json local/attachments;
      mc anonymous set none local/case-evidence;
      mc anonymous set none local/geo-datasets;
      mc anonymous get-json local/attachments > /tmp/attachments-policy.json;
      sha256sum -c /policies/attachments-public-policy.sha256;
      '

  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://geo:geo_dev_pw@postgres:5432/geo_grilagem
      MARTIN_LISTEN_ADDRESSES: 0.0.0.0:3000
    ports:
      - "3010:3000"
